<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e6">
  <title>skvoznoe</title>
  <meta name="description" content="сквозное">
  <meta property="og:title" content="skvoznoe">
  <meta property="og:description" content="сквозное">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://skvoznoe.app">

  <!-- Favicon: minimal bullet -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23181818'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23f4f0e6'/%3E%3Ccircle cx='90' cy='90' r='50' fill='%23181818'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Paper grain + scanline filters (hidden SVG) -->
  <svg class="filters-def" aria-hidden="true" focusable="false">
    <defs>
      <!-- Hand-drawn ink filter for logotype -->
      <filter id="f-ink" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.028 0.012" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>

      <!-- Softer ink filter for ghost layer -->
      <filter id="f-ink-ghost" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.022 0.009" numOctaves="2" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>

      <!-- Subtle roughness for surreal elements -->
      <filter id="f-rough" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" seed="12" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- Surreal element: Cloud with mountain peak (top-right) -->
  <div class="el" id="el-cloud" aria-hidden="true">
    <svg viewBox="0 0 90 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Cloud outline -->
      <path d="M18 42 C8 42 4 34 10 28 C10 18 20 14 28 20 C32 12 44 10 50 18 C58 14 68 20 66 30 C72 32 74 42 64 44 Z"
            stroke="#181818" stroke-width="1.3" stroke-linejoin="round" fill="none" filter="url(#f-rough)"/>
      <!-- Mountain peak inside cloud -->
      <path d="M30 40 L42 22 L54 40" stroke="#374f37" stroke-width="1.1" stroke-linejoin="round" fill="none" opacity="0.7" filter="url(#f-rough)"/>
      <path d="M36 40 L42 30 L48 40" fill="#374f37" opacity="0.15"/>
    </svg>
  </div>

  <!-- Surreal element: Pear / teardrop (left) -->
  <div class="el" id="el-pear" aria-hidden="true">
    <svg viewBox="0 0 40 70" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 8 C20 8 20 2 20 2" stroke="#181818" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Pear body -->
      <path d="M20 10 C20 10 28 18 30 28 C32 38 28 52 20 56 C12 52 8 38 10 28 C12 18 20 10 20 10 Z"
            stroke="#181818" stroke-width="1.3" fill="none" filter="url(#f-rough)"/>
      <!-- Leaf hint -->
      <path d="M20 10 C24 6 30 8 28 14" stroke="#374f37" stroke-width="1.0" fill="none" opacity="0.6"/>
    </svg>
  </div>

  <!-- Surreal element: Vertical airplane silhouette (top-left) -->
  <div class="el" id="el-plane" aria-hidden="true">
    <svg viewBox="0 0 30 70" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Fuselage -->
      <path d="M15 4 L15 62" stroke="#181818" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Wings -->
      <path d="M15 28 L4 36 L15 34 L26 36 L15 28" stroke="#181818" stroke-width="1.2" fill="none" filter="url(#f-rough)"/>
      <!-- Tail fins -->
      <path d="M15 58 L8 62 M15 58 L22 62" stroke="#181818" stroke-width="1.1" stroke-linecap="round"/>
      <!-- Nose -->
      <path d="M13 4 L15 1 L17 4" stroke="#181818" stroke-width="1.1" fill="none"/>
    </svg>
  </div>

  <!-- Surreal element: Jar with bubbles (bottom-right) -->
  <div class="el" id="el-jar" aria-hidden="true">
    <svg viewBox="0 0 50 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Jar lid -->
      <rect x="12" y="6" width="26" height="6" rx="2" stroke="#181818" stroke-width="1.2" fill="none" filter="url(#f-rough)"/>
      <!-- Jar body -->
      <path d="M10 12 L8 68 Q25 72 42 68 L40 12 Z" stroke="#181818" stroke-width="1.3" fill="none" filter="url(#f-rough)"/>
      <!-- Contents fill hint -->
      <path d="M10 50 Q25 54 40 50" stroke="#181818" stroke-width="0.8" opacity="0.3"/>
      <!-- Bubbles ascending -->
      <circle cx="20" cy="44" r="3" stroke="#181818" stroke-width="1.0" fill="none" class="bubble-a"/>
      <circle cx="30" cy="32" r="2.5" stroke="#181818" stroke-width="1.0" fill="none" class="bubble-b"/>
      <circle cx="23" cy="20" r="2" stroke="#181818" stroke-width="1.0" fill="none" class="bubble-c"/>
    </svg>
  </div>

  <!-- Surreal element: Sun with rays (bottom-left) -->
  <div class="el" id="el-sun" aria-hidden="true">
    <svg viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Sun body -->
      <circle cx="35" cy="35" r="10" stroke="#181818" stroke-width="1.3" fill="none" filter="url(#f-rough)"/>
      <!-- Rays (8 ticks) -->
      <line x1="35" y1="10" x2="35" y2="18" stroke="#7a2d2d" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
      <line x1="35" y1="52" x2="35" y2="60" stroke="#7a2d2d" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
      <line x1="10" y1="35" x2="18" y2="35" stroke="#7a2d2d" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
      <line x1="52" y1="35" x2="60" y2="35" stroke="#7a2d2d" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
      <line x1="18" y1="18" x2="24" y2="24" stroke="#7a2d2d" stroke-width="1.0" stroke-linecap="round" opacity="0.5"/>
      <line x1="46" y1="46" x2="52" y2="52" stroke="#7a2d2d" stroke-width="1.0" stroke-linecap="round" opacity="0.5"/>
      <line x1="52" y1="18" x2="46" y2="24" stroke="#7a2d2d" stroke-width="1.0" stroke-linecap="round" opacity="0.5"/>
      <line x1="18" y1="52" x2="24" y2="46" stroke="#7a2d2d" stroke-width="1.0" stroke-linecap="round" opacity="0.5"/>
    </svg>
  </div>

  <!-- Center zone with corner registration marks -->
  <div class="zone" aria-hidden="true">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
  </div>

  <!-- Logo area -->
  <main class="stage">
    <!-- Off-register ghost (misprint illusion) -->
    <div class="register-ghost" aria-hidden="true">
      <svg class="logo-svg" viewBox="0 0 420 90" xmlns="http://www.w3.org/2000/svg">
        <text x="210" y="74" text-anchor="middle"
              font-family="Georgia, 'Times New Roman', serif"
              font-size="78" font-weight="900"
              fill="none" stroke="#7a2d2d" stroke-width="1.6"
              letter-spacing="-3"
              filter="url(#f-ink-ghost)">skvoznoe</text>
      </svg>
    </div>

    <!-- Main logotype + speech bubble -->
    <div class="logo-wrap" id="logo-wrap" role="button" tabindex="0" aria-label="skvoznoe">
      <svg class="logo-svg" viewBox="0 0 420 90" xmlns="http://www.w3.org/2000/svg">
        <text x="210" y="74" text-anchor="middle"
              font-family="Georgia, 'Times New Roman', serif"
              font-size="78" font-weight="900"
              fill="none" stroke="#181818" stroke-width="1.8"
              letter-spacing="-3"
              filter="url(#f-ink)">skvoznoe</text>
      </svg>

      <div class="bubble" id="bubble" role="tooltip">
        <span>забери с собой свои две сосиски</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
