<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skvoznoe</title>
    <meta name="description" content="surreal engraving collage" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="paperWarp">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="3" result="t">
            <animate attributeName="baseFrequency" dur="22s" values="0.012 0.018; 0.018 0.012; 0.012 0.018" repeatCount="indefinite" />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="6" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <section class="hero" id="hero-scene">
      <div class="scene" id="scene-objects" aria-hidden="true"></div>
      <div class="content">
        <h1 class="title">skvoznoe</h1>
        <p class="asset-hint" id="asset-hint" hidden></p>
      </div>
    </section>
    <div class="grain" aria-hidden="true"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
